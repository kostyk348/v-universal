[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v-universal"
version = "0.1.0"
description = "One versioning model (trunk + version tree) applied to nine domains: hardware, quantum, biology, physics, math, law, economy, consciousness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "V-UNIVERSAL Contributors" }]
keywords = [
    "versioning",
    "transactional-memory",
    "git",
    "blockchain",
    "quantum",
    "simulation",
    "multiverse",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
examples = [
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/your-org/v-universal"
Repository = "https://github.com/your-org/v-universal"
Issues = "https://github.com/your-org/v-universal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/v_universal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
"src/v_universal/math_layer.py" = ["N999"]  # module name intentionally uses math_layer
"src/v_universal/economy.py" = ["N818"]  # InsufficientFunds is a domain term, not Error-suffixed

[tool.ruff.format]
quote-style = "double"
